<!doctype html><html><body style="margin:0;background:#333"><iframe id="mobile" src="/" width="390" height="780" style="border:0"></iframe><pre id="metrics" style="color:white"></pre><script>
const f=document.querySelector('iframe'),out=document.querySelector('pre');f.onload=()=>{const start=performance.now();let first=null,last=null,shown=false,min=100,max=0,scene=false;const timer=setInterval(()=>{const d=f.contentDocument,w=f.contentWindow,loader=d.querySelector('.welcome');if(loader){shown=true;first??=performance.now()-start;last=performance.now()-start;const p=parseInt(d.querySelector('.loader-percentage')?.textContent||'0');min=Math.min(min,p);max=Math.max(max,p);scene ||= !!d.querySelector('.loader-scene-ready');}out.textContent=JSON.stringify({elapsed:Math.round(performance.now()-start),shown,first,last,min,max,scene,width:w.innerWidth,overflow:d.documentElement.scrollWidth>w.innerWidth,canvas:d.querySelectorAll('canvas').length,navBackground:w.getComputedStyle(d.querySelector('#navbar')).backgroundColor},null,2);if(performance.now()-start>6000)clearInterval(timer);},80);};
</script></body></html>
