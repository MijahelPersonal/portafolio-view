<!doctype html><html lang="es"><head><meta charset="utf-8"><title>QA última ronda</title><style>body{margin:0;background:#27232d;color:white;font:12px monospace}iframe{display:block;border:0;width:390px;height:780px;margin:0 auto}pre{white-space:pre-wrap}</style></head><body><iframe id="preview" src="/"></iframe><pre id="results"></pre><script>
const frame=document.querySelector('iframe'),results=document.querySelector('pre');frame.style.width=(new URLSearchParams(location.search).get('width')||390)+'px';const samples=[];let start;
frame.addEventListener('load',()=>{const w=frame.contentWindow,d=w.document;start=performance.now();let maximum=0,seen=false;
const timer=setInterval(()=>{const loader=d.querySelector('.welcome'),pct=d.querySelector('.loader-percentage');if(pct){maximum=Math.max(maximum,parseInt(pct.textContent));seen=true;}if(!loader&&seen){clearInterval(timer);results.textContent=JSON.stringify({loaderMilliseconds:Math.round(performance.now()-start),maximum,width:w.innerWidth,overflow:d.documentElement.scrollWidth>w.innerWidth,fontRequested:w.performance.getEntriesByType('resource').some(x=>x.name.includes('helvetiker'))},null,2);}},40);
d.addEventListener('click',event=>{if(!event.target.closest('a[href^="#"]'))return;const began=performance.now(),initial=w.scrollY,positions=[];const track=setInterval(()=>{positions.push(Math.round(w.scrollY));if(performance.now()-began>1800){clearInterval(track);window.scrollSamples={initial,positions,distinct:new Set(positions).size,final:w.scrollY};results.textContent=JSON.stringify(window.scrollSamples,null,2);}},30);});
});</script><button id="qa-video" style="position:fixed;left:10px;top:10px" onclick="const w=preview.contentWindow,s=w.document.querySelector('.video-journey');w.scrollTo(0,s.offsetTop+(s.offsetHeight-w.innerHeight)*.57);setTimeout(()=>{const d=w.document;results.textContent=JSON.stringify({navbarVisibility:getComputedStyle(d.querySelector('#navbar')).visibility,frameClip:getComputedStyle(d.querySelector('.intro-frame')).clipPath},null,2)},1400)">Video pleno</button><button id="qa-exit" style="position:fixed;left:10px;top:45px" onclick="const w=preview.contentWindow,s=w.document.querySelector('.video-journey');w.scrollTo(0,s.offsetTop+s.offsetHeight+50);setTimeout(()=>results.textContent=JSON.stringify({navbarVisibility:getComputedStyle(w.document.querySelector('#navbar')).visibility},null,2),1400)">Salir del video</button></body></html>
