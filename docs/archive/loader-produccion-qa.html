<!doctype html><html><head><meta charset="utf-8"><title>Loader dev/preview QA</title><style>html,body{margin:0;height:100%;overflow:clip;background:#27232d;color:#fff;font:12px monospace}iframe{display:block;margin:auto;border:0}pre{position:fixed;right:8px;bottom:8px;max-width:350px;pointer-events:none;white-space:pre-wrap;background:#27232dcc}</style></head><body><iframe id="preview"></iframe><pre id="results">Esperando loader…</pre><script>
const params=new URLSearchParams(location.search),frame=document.querySelector('iframe'),out=document.querySelector('pre');frame.style.width=(params.get('w')||1280)+'px';frame.style.height=(params.get('h')||720)+'px';frame.src='/';
const data={viewport:[],samples:0,maxDx:0,maxDy:0,maxPercent:0,stars:false,transition:false,done:false};
frame.addEventListener('load',()=>{const w=frame.contentWindow,d=w.document;data.viewport=[w.innerWidth,w.innerHeight];const start=performance.now();
function sample(){const screen=d.querySelector('.welcome'),position=d.querySelector('.loader-position'),pct=d.querySelector('.loader-percentage');if(screen){data.maxPercent=Math.max(data.maxPercent,parseInt(pct?.textContent)||0);data.stars ||= !!d.querySelector('.loader-scene-ready canvas');data.transition ||= screen.classList.contains('welcome-revealing');if(position&&data.maxPercent>0&&!data.transition){const r=position.getBoundingClientRect();data.samples++;data.maxDx=Math.max(data.maxDx,Math.abs(r.left+r.width/2-w.innerWidth/2));data.maxDy=Math.max(data.maxDy,Math.abs(r.top+r.height/2-w.innerHeight/2));data.translate=getComputedStyle(position).translate;data.transform=getComputedStyle(position).transform;data.width=r.width;}}else if(data.samples){data.done=true;data.elapsed=Math.round(performance.now()-start);data.scroll=w.scrollY;data.heroTop=d.querySelector('#inicio').getBoundingClientRect().top;data.overflow=d.documentElement.scrollWidth>d.documentElement.clientWidth;out.textContent=JSON.stringify(data,null,2);return;}
out.textContent=JSON.stringify(data,null,2);if(performance.now()-start<10000)requestAnimationFrame(sample);}requestAnimationFrame(sample);
});
</script></body></html>
